# CI: on push to main — build tools and tests, run analyzers, generate reports.
# Artifacts: report.txt, results/
# Caches: submodules (by .gitmodules + index), tools builds (by phasar/sea-dsa/SVF refs).

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Submodule cache key
        id: submod-key
        run: echo "key=submodules-${{ runner.os }}-${{ hashFiles('.gitmodules', '.git/index') }}" >> $GITHUB_OUTPUT

      - name: Restore submodules cache
        uses: actions/cache/restore@v4
        id: cache-submodules
        with:
          path: |
            .git/modules
            phasar
            sea-dsa
            SVF
            tests/Test-Suite
          key: ${{ steps.submod-key.outputs.key }}
          fail-on-cache-miss: false

      - name: Checkout submodules (HTTPS for token auth)
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: |
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git submodule sync
          if ! git submodule update --init --recursive; then
            echo "::warning::Submodule update failed (referenced commit may be missing on remote). Checking out default branch for failed submodule(s)..."
            for path in phasar sea-dsa SVF tests/Test-Suite; do
              if [[ -d "$path/.git" ]]; then
                (cd "$path" && git fetch origin 2>/dev/null; git checkout origin/HEAD 2>/dev/null || git checkout main 2>/dev/null || git checkout master 2>/dev/null || true)
              else
                git submodule update --init "$path" 2>/dev/null || true
              fi
            done
          fi

      - name: Sync submodules after cache restore
        if: steps.cache-submodules.outputs.cache-hit == 'true'
        run: |
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git submodule sync
          git submodule update --init --recursive

      - name: Save submodules cache
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/modules
            phasar
            sea-dsa
            SVF
            tests/Test-Suite
          key: ${{ steps.submod-key.outputs.key }}

      - name: Tools cache key
        id: tools-key
        run: |
          P=$(git rev-parse HEAD:phasar 2>/dev/null || echo none)
          S=$(git rev-parse HEAD:sea-dsa 2>/dev/null || echo none)
          V=$(git rev-parse HEAD:SVF 2>/dev/null || echo none)
          echo "key=tools-${{ runner.os }}-$P-$S-$V" >> $GITHUB_OUTPUT

      - name: Restore tools build cache
        uses: actions/cache/restore@v4
        id: cache-tools
        with:
          path: |
            phasar/build
            sea-dsa/build
            SVF/build
          key: ${{ steps.tools-key.outputs.key }}
          fail-on-cache-miss: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: alias-analysis-ubuntu24:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build tools and tests, run analyzers, generate reports
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            alias-analysis-ubuntu24:ci \
            bash -c '
              set -e
              make tools-all
              make test-all
              make run-tsuite
              make run-scalability
              make report > report.txt
            '

      - name: Save tools build cache
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            phasar/build
            sea-dsa/build
            SVF/build
          key: ${{ steps.tools-key.outputs.key }}

      - name: Upload report and results
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-results
          path: |
            report.txt
            results/
  deploy-pages:
    name: Deploy reports to GitHub Pages
    needs: build-and-report
    runs-on: ubuntu-24.04

    # GitHub Pages environment (рекомендуемый паттерн)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download reports artifact
        uses: actions/download-artifact@v4
        with:
          name: reports-and-results
          path: ./artifact

      - name: Prepare static site
        run: |
          mkdir -p site

          # Копируем сырой артефакт внутрь сайта (чтобы были прямые ссылки)
          cp -r artifact/results site/results || true
          cp artifact/report.txt site/report.txt || true

          # Генерим простую HTML-страницу
          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          site = Path("site")
          rep = (site / "report.txt").read_text(encoding="utf-8", errors="ignore") if (site / "report.txt").exists() else "No report.txt"

          # Обрезаем превью, чтобы страница была маленькой
          rep_preview = "\n".join(rep.splitlines()[:80])

          html = f"""<!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Alias Analysis CI Reports</title>
            <style>
              body {{ font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.4; }}
              pre {{ background: #f6f8fa; padding: 1rem; border-radius: 8px; overflow-x: auto; }}
              .card {{ border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }}
              a {{ text-decoration: none; }}
            </style>
          </head>
          <body>
            <h1>Alias Analysis CI Reports</h1>

            <div class="card">
              <h2>Report</h2>
              <p><a href="./report.txt">Открыть полный .txt</a></p>
              <pre>{escape(rep_preview)}</pre>
            </div>

            <div class="card">
              <h2>Raw results</h2>
              <p><a href="./results/">Каталог results/</a></p>
            </div>
          </body>
          </html>"""
          (site / "index.html").write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
